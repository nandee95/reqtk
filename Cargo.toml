[package]
name = "reqtk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ReqTk is a requirements management toolkit built around a human-readable, git-friendly `.req` file format."
keywords = ["req", "requirement", "test"]
repository = "https://github.com/nandee95/reqtk"
documentation = "https://docs.rs/reqtk"

[dependencies]
adar = "0.3.0"
clap = { version = "4.6.7", features = ["derive"] }
fontdue = "0.9.4"
glob = "0.3.4"
html-escape = "0.2.15"
peekmore = "1.3.0"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url-escape = "0.1.2"
utf8-chars = "3.0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"

[dev-dependencies]
tempfile = "3.27.0"
