[package]
name = "reqtk"
version = "0.1.0"
edition = "2024"

[dependencies]
adar = "0.3.0"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
peekmore = "1.3.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
utf8-chars = "3.0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
