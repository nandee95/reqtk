[package]
name = "req-file"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Parser and verifier for the '.req' file format."
keywords = ["req", "requirement", "test"]
repository = "https://github.com/nandee95/reqtk"
documentation = "https://docs.rs/reqtk"

[features]
default = []

[dependencies]
adar = "0.3.0"
peekmore = "1.3.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
utf8-chars = "3.0.7"
